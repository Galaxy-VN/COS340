<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý Sản phẩm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    .swagger-ui .topbar { display: none; }
    .swagger-ui .info .title { color: var(--bs-body-color) !important; }
    .swagger-ui .scheme-container { background: transparent; box-shadow: none; }
    .swagger-ui .opblock.opblock-get { border-color: #0d6efd; }
    .swagger-ui .opblock.opblock-post { border-color: #198754; }
    .swagger-ui .opblock.opblock-put { border-color: #ffc107; }
    .swagger-ui .opblock.opblock-delete { border-color: #dc3545; }
    #swagger-container { min-height: 600px; }
  </style>
</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-black bg-opacity-50 border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="fas fa-cubes me-2"></i>COS340 Shop
      </a>
    </div>
  </nav>

  <div class="container py-4">
    <!-- Tabs -->
    <ul class="nav nav-tabs mb-4" id="mainTabs">
      <li class="nav-item">
        <button class="nav-link active" data-tab="products">Sản phẩm</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-tab="categories">Danh mục</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-tab="docs">
          <i class="fas fa-book me-1"></i>API Docs
        </button>
      </li>
    </ul>

    <!-- Products Section -->
    <section id="products-section">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Sản phẩm</h4>
        <button class="btn btn-primary btn-sm" id="btn-add-product">
          <i class="fas fa-plus me-1"></i>Thêm mới
        </button>
      </div>
      <div id="products-loading" class="text-center py-4">
        <div class="spinner-border text-primary"></div>
      </div>
      <div id="products-table-wrap" style="display:none;">
        <table class="table table-dark table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tên</th>
              <th>Mô tả</th>
              <th>Giá</th>
              <th>Danh mục</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="products-tbody"></tbody>
        </table>
      </div>
      <div id="products-empty" class="text-center text-muted py-4" style="display:none;">Chưa có sản phẩm nào.</div>
    </section>

    <!-- Categories Section -->
    <section id="categories-section" style="display:none;">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Danh mục</h4>
        <button class="btn btn-primary btn-sm" id="btn-add-category">
          <i class="fas fa-plus me-1"></i>Thêm mới
        </button>
      </div>
      <div id="categories-loading" class="text-center py-4">
        <div class="spinner-border text-primary"></div>
      </div>
      <div id="categories-table-wrap" style="display:none;">
        <table class="table table-dark table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tên</th>
              <th>Mô tả</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="categories-tbody"></tbody>
        </table>
      </div>
      <div id="categories-empty" class="text-center text-muted py-4" style="display:none;">Chưa có danh mục nào.</div>
    </section>

    <!-- API Docs Section -->
    <section id="docs-section" style="display:none;">
      <div id="swagger-container"></div>
    </section>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="formModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content bg-dark border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="modal-title"></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="modal-errors" class="alert alert-danger" style="display:none;"></div>
          <form id="modal-form">
            <input type="hidden" id="form-id" />
            <div id="form-fields"></div>
          </form>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="button" class="btn btn-primary" id="btn-save">
            <i class="fas fa-save me-1"></i>Lưu
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    let swaggerLoaded = false;
    document.querySelectorAll('#mainTabs .nav-link').forEach(btn => {
      btn.addEventListener('click', function() {
        if (this.dataset.tab === 'docs' && !swaggerLoaded) {
          swaggerLoaded = true;
          SwaggerUIBundle({
            url: '/phamgiahuy/api-docs/swagger.json',
            dom_id: '#swagger-container',
            presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
            layout: 'BaseLayout',
            deepLinking: true,
            tryItOutEnabled: true
          });
        }
      });
    });
  </script>
</body>
</html>
